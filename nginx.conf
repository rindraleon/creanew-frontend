# Modèle substitué au démarrage. Ne journalise pas les paramètres d'URL.
log_format privacy '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent';

server {
    listen ${PORT};
    server_name _;
    access_log /dev/stdout privacy;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # Résolution renouvelée : une adresse interne Render peut changer après un déploiement.
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    set $api_upstream ${API_UPSTREAM_ORIGIN};

    # Même origine pour le navigateur et ses cookies. Le chemin /api est conservé.
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        # Pour un upstream HTTPS public Render, Host doit désigner le backend,
        # sinon le routeur Render pourrait renvoyer vers ce frontend.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # Fichiers uploadés servis par l'API (stockage local) : même origine pour le navigateur.
    location /uploads/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
}
